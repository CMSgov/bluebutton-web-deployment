---
- name: " Create the virtualenv folder"
  become_user: "{{ remote_admin_account }}"
  become: yes
  file:
    dest: "/var/virtualenv"
    owner: "{{ app_pyapps_user }}"
    group: "{{ app_pyapps_user }}"
    mode: 0755
    state: directory

- name: "Create the app folder"
  become_user: "{{ remote_admin_account }}"
  become: yes
  file:
    dest: "/var/pyapps"
    owner: "{{ app_pyapps_user }}"
    group: "{{ app_pyapps_user }}"
    mode: 0755
    state: directory

- name: Stop and disable Splunk Universal Forwarder
  become_user: "root"
  become: yes
  systemd:
    name: splunk
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Remove Splunk Universal Forwarder package
  become_user: "root"
  become: yes
  dnf:
    name: splunkforwarder
    state: absent

- name: Clean up leftover Splunk directories
  become_user: "root"
  become: yes
  file:
    path: /opt/splunkforwarder
    state: absent
